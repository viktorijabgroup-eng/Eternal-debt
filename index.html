.panel{

.row{

.small{

}

.jobs{

}

.job{

.jobTitle{

}

.actions{

  gap:8px;

}

button{
  border:1px solid #3b404b;
  border-radius:14px;
  padding:12px 14px;
  font-size:15px;
  font-weight:750;

  color:white;
}

button.primary{
  background:white;
  color:#111;
}

button.green{
  background:#183c2b;
  border-color:#287c54;
  color:#b9ffd8;
}

button:disabled{
  opacity:.28;
}

.hidden{
  display:none!important;
}

.bar{
  height:8px;
  background:#30343d;
  border-radius:99px;
  overflow:hidden;
  margin:14px 0;
}

.fill{
  height:100%;
  width:0;
  background:#6ce3a6;
  transition:.25s;
}

.stage{
  padding:13px;
  margin-top:10px;
}

.stage.done{
  opacity:.4;
}

.bill{
  padding:12px;
  margin-top:9px;
}

.greenText{

}

.red{

}

.orange{
  color:#ffd38c;
}

.result{

.resultTop{

.resultGain{

.resultGrid{

function name(object){

 return language==="ru"
 ?object.ru
 :object.en;

}


function debt(){

 return game.bills.reduce(
 (sum,bill)=>sum+bill.amount,
 0
 );

}


function updateSky(){

 let hero=document.getElementById("hero");

 hero.classList.remove(
 "morning",
 "day",
 "evening",
 "night"
 );

 let icon="";

 if(game.time<600){

  hero.classList.add("morning");
  icon="🌅";

 }

 else if(game.time<1020){

  hero.classList.add("day");
  icon="☀️";

 }

 else if(game.time<1200){

  hero.classList.add("evening");
  icon="🌇";

 }

 else{

  hero.classList.add("night");
  icon="🌙";

 }

 document.getElementById("labelTime").textContent=
 t("time")+" "+icon;

}


function render(){

 updateSky();

 document.getElementById("day").textContent=
 game.day+" / 20";

 document.getElementById("time").textContent=
 fmt(game.time);

 document.getElementById("cash").textContent=
 money(game.cash);

 document.getElementById("debt").textContent=
 money(debt());

 document.getElementById("energy").textContent=
 game.energy+" ⚡";


 document.getElementById("labelDay").textContent=
 t("day");

 document.getElementById("labelCash").textContent=
 t("cash");

 document.getElementById("labelDebt").textContent=
 t("debt");

 document.getElementById("labelEnergy").textContent=
 t("energy");


 document.getElementById("subtitle").textContent=
 t("subtitle");


 document.getElementById("todayTitle").textContent=
 t("today");

 document.getElementById("todayText").textContent=

 document.getElementById("sleepBtn").textContent=
 t("sleep");


 document.getElementById("debtCenterTitle").textContent=

 document.getElementById("debtCenterText").textContent=

 document.getElementById("currentJobLabel").textContent=
 t("currentJob");

 document.getElementById("workTimeLabel").textContent=
 t("time");


 document.getElementById("langBtn").textContent=
 language==="en"
 ?"RU"
 :"EN";


 renderJobs();
 renderBills();

 localStorage.setItem(
 SAVE_KEY,
 JSON.stringify({
  game,
  language
 })
 );

}


function renderJobs(){

 let box=
 document.getElementById("jobs");

 box.innerHTML="";


 jobs
 .filter(job=>game.day>=job.unlock)
 .forEach(job=>{


 let duration=
 Math.round(job.hours*60);


 let available=

 !game.working
 &&
 game.energy>=job.energy
 &&
 game.time+duration<=1380;


 let div=
 document.createElement("div");

 div.className="job";


 div.innerHTML=

 `<div class="jobTitle">
 ${name(job)}
 </div>

 <div class="small">
 ${job.hours}h · −${job.energy} ⚡ · +${money(job.pay)}
 </div>`;


 let btn=
 document.createElement("button");

 btn.className="primary";

 btn.style.marginTop="10px";

 btn.textContent=
 available
 ?t("start")
 :t("unavailable");

 btn.disabled=
 !available;


 btn.onclick=()=>startJob(job);


 div.appendChild(btn);

 box.appendChild(div);

 });

}


function startJob(job){

 const startCash=
 game.cash;

 const startTime=
 game.time;


 game.working=true;

 game.energy-=job.energy;


 document
 .getElementById("home")
 .classList.add("hidden");


 document
 .getElementById("work")
 .classList.remove("hidden");


 document.getElementById("workTitle").textContent=
 name(job);


 document.getElementById("workTime").textContent=
 fmt(game.time);


 document.getElementById("progress").style.width=
 "0%";


 buildStages(
 job,
 startCash,
 startTime
 );

 render();

}


function buildStages(
 job,
 startCash,
 startTime
){

 let box=
 document.getElementById("stages");

 box.innerHTML="";


 let completedStages=0;


 job.stages.forEach(
 (stage,index)=>{


 let div=
 document.createElement("div");

 div.className="stage";


 div.innerHTML=

 `<b>
 ${index+1}. ${name(stage)}
 </b>`;


 let actions=
 document.createElement("div");

 actions.className="actions";


 let completedButtons=0;


 stage.buttons.forEach(label=>{


 let button=
 document.createElement("button");


 button.textContent=
 label;


 button.onclick=()=>{


 if(button.disabled)return;


 button.disabled=true;

 button.textContent=
 "✓ "+label;


 completedButtons++;


 if(
 completedButtons===
 stage.buttons.length
 ){


 div.classList.add("done");


 game.time+=
 stage.minutes;


 completedStages++;


 document
 .getElementById("workTime")
 .textContent=
 fmt(game.time);


 document
 .getElementById("progress")
 .style.width=

 (completedStages/
 job.stages.length*
 100)+"%";


 updateSky();


 if(
 completedStages===
 job.stages.length
 ){

 finishJob(
 job,
 startCash,
 startTime
 );

 }

 }

 };


 actions.appendChild(button);

 });


 div.appendChild(actions);

 box.appendChild(div);

 });

}


function finishJob(
 job,
 startCash,
 startTime
){

 game.cash+=job.pay;

 game.earned+=job.pay;

 game.jobsDone++;

 game.working=false;


 setTimeout(()=>{


 document
 .getElementById("work")
 .classList.add("hidden");


 showJobResult(
 job,
 startCash,
 startTime
 );


 render();


 },350);

}

 <div class="small">

 <br>
 ${t("finished")}:
 <b>${fmt(game.time)}</b>

 </div>

 +${money(job.pay)}

 </div>


 <div class="resultGrid">

 <div class="card">

 ${t("balanceBefore")}
 </div>

 <div class="value">
 ${money(startCash)}

}


function closeResult(){

 document
 .getElementById("result")
 .classList.add("hidden");

 document
 .getElementById("home")
 .classList.remove("hidden");

 document
 .getElementById("progress")
 .style.width="0%";

 render();

}


function renderBills(){

 let box=
 document.getElementById("bills");

 box.innerHTML="";


 game.bills.forEach(
 (bill,index)=>{


 let days=
 bill.due-game.day;


 let status;


 if(days<0){

 status=
 `<span class="red">
 ${t("overdue")} ${Math.abs(days)}d
 </span>`;

 }

 else if(days===0){

 status=
 `<span class="orange">
 ${t("dueToday")}
 </span>`;

 }

 else{

 status=
 `${t("dueIn")} ${days}d`;

 }


 let div=
 document.createElement("div");

 div.className="bill";


 div.innerHTML=

 `<div class="row">

 <div>

 <b>
 ${name(bill)}
 </b>

 <div class="small">
 ${status}
 </div>

 ${
 bill.partial
 ?''
 :`<div class="small orange">
 ${t("fullOnly")}
 </div>`
 }

 </div>

 <b>
 ${money(bill.amount)}
 </b>

 </div>`;


 let actions=
 document.createElement("div");

 actions.className="actions";


 let full=
 document.createElement("button");

 full.textContent=
 t("payNow");

 full.disabled=
 game.cash<bill.amount;

 full.onclick=()=>payBill(
 index,
 bill.amount

 actions.appendChild(full);


 if(bill.partial){

 document.createElement("button");

 t("pay100");

 pay100.disabled=
 game.cash<100

 bill.amount<100;

 pay100.onclick=()=>payBill(
 index,
 100

 game.cash<500
 ||
 bill.amount<500;

 pay500.onclick=()=>payBill(
 index,
 500
 );

 actions.appendChild(pay500);

 }


 let later=
 document.createElement("button");

 later.textContent=
 t("payLater");

 later.onclick=()=>{

 later.disabled=true;

 };


 actions.appendChild(later);

 div.appendChild(actions);

 box.appendChild(div);

 });

}


function payBill(
 index,
 amount
){

 let bill=
 game.bills[index];


 amount=
 Math.min(
 amount,
 bill.amount
 );


 game.cash-=amount;

 game.paid+=amount;

 bill.amount-=amount;


 if(bill.amount<=0){

 game.bills.splice(
 index,
 1
 );

 }


 render();

}


function sleep(){

 if(game.working)return;


 if(game.day>=20){

 finishGame();

 return;

 }


 game.day++;

 game.time=420;

 game.energy=100;


 events.forEach(event=>{


 if(event.day===game.day){


 game.bills.push({

 id:game.nextId++,

 en:event.en,
 ru:event.ru,

 amount:event.amount,

 due:
 game.day+
 event.deadline,

 partial:
 event.partial

 });


 showEvent(
 t("newDay"),
 `${name(event)}
 <br>
 <b>${money(event.amount)}</b>`
 );

 }

 });


 game.bills.forEach(bill=>{


 if(
 game.day===
 bill.due+1
 ){

 let fee=
 Math.max(
 10,
 Math.round(
 bill.amount*.05
 )
 );

 bill.amount+=fee;

 }

 });


 render();

}


function showEvent(
 title,
 content
){

 let event=
 document.getElementById("event");


 event.innerHTML=

 `<div class="newDay">

 <div class="label">
 ${title}
 </div>

 <div style="
 font-size:22px;
 font-weight:800;
 margin-top:7px
 ">

 ${content}

 </div>

 </div>`;


 event.classList.remove("hidden");


 setTimeout(()=>{

 event.classList.add("hidden");

 },2400);

}


function toggleLanguage(){

 language=
 language==="en"
 ?"ru"
 :"en";

 render();

}


function finishGame(){

 document
 .getElementById("home")
 .classList.add("hidden");


 let ending=
 document.getElementById("ending");


 ending.classList.remove("hidden");


 ending.innerHTML=

 `<h2>
 ${t("ending")}
 </h2>

 <p>
 ${t("cash")}:
 <b>${money(game.cash)}</b>
 </p>

 <p>
 ${t("debt")}:
 <b>${money(debt())}</b>
 </p>

 <p>
 Total earned:
 <b>${money(game.earned)}</b>
 </p>

 <p>
 Debt paid:
 <b>${money(game.paid)}</b>
 </p>

 <p>
 Jobs:
 <b>${game.jobsDone}</b>
 </p>

 <button
 class="primary"
 onclick="restart()">

 ${t("playAgain")}

 </button>`;

}


function restart(){

 localStorage.removeItem(
 SAVE_KEY
 );

 location.reload();

}


let saved=
 localStorage.getItem(
 SAVE_KEY
 );


if(saved){

 try{

 let parsed=
 JSON.parse(saved);

 game=
 parsed.game||game;

 language=
 parsed.language||"en";

 }

 catch(e){}

}


setInterval(()=>{

 if(
 !game.working
 &&
 game.time<1380
 ){

 game.time++;

 document
 .getElementById("time")
 .textContent=
 fmt(game.time);

 updateSky();

 }

},1000);


render();

</script>

</body>
</html>
